{% extends "admin/base.html" %}
{% load i18n static %}

{% block content %}
<div class="flex items-center justify-center min-h-[60vh]">
    <div class="bg-white p-10 rounded-3xl shadow-xl shadow-slate-200 border border-slate-100 max-w-md w-full text-center">
        <div class="w-20 h-20 bg-primary-100 rounded-2xl flex items-center justify-center mx-auto mb-6 text-primary-600 text-3xl">
            <i class="fas fa-sign-out-alt"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-900 mb-2">Logged Out</h2>
        <p class="text-slate-500 mb-8">Thanks for spending some time with the administration interface today.</p>
        <a href="{% url 'admin:index' %}" class="inline-block bg-primary-600 text-white px-8 py-3 rounded-xl font-bold shadow-lg shadow-primary-200 hover:bg-primary-700 transition-all">
            Log back in
        </a>
    </div>
</div>
{% endblock %}
