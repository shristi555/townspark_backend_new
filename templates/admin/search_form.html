{% load i18n static %}
{% if cl.search_fields %}
<div id="toolbar" class="flex-1 min-w-[200px]">
    <form id="changelist-search" method="get" class="relative group">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="fas fa-search text-slate-400 group-focus-within:text-primary-500 transition-colors"></i>
        </div>
        <input type="text" size="40" name="{{ search_var }}" value="{{ cl.query }}" id="searchbar" autofocus
            class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all shadow-sm placeholder-slate-400"
            placeholder="{% translate 'Search' %} {{ cl.opts.verbose_name_plural|capfirst }}..."> 
        
        {% for pair in cl.params.items %}
            {% if pair.0 != search_var %}<input type="hidden" name="{{ pair.0 }}" value="{{ pair.1 }}">{% endif %}
        {% endfor %}
    </form>
</div>
{% endif %}
